<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen</title>
    <style>
      :root {
        --bg1: #0c1631;
        --bg2: #243d64;
        --bg3: #6da4d9;
        --text: #edf6ff;
        --sub: rgba(255,255,255,0.7);
        --glass: rgba(255,255,255,0.12);
        --glass-border: rgba(255,255,255,0.18);
        --accent: #79b6ff;
        --shadow: rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 35%, var(--bg3) 100%);
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .scene {
        position: relative;
        width: min(100vw, 440px);
        height: min(100vh, 900px);
        background:
          radial-gradient(circle at 15% 20%, rgba(255,255,255,0.25), transparent 18%),
          radial-gradient(circle at 80% 25%, rgba(255,255,255,0.18), transparent 20%),
          linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.22)),
          linear-gradient(135deg, #0d1730 0%, #172d4f 26%, #456d9a 55%, #89b2db 100%);
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0,0,0,0.4);
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: -10% 0 0 0;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
          radial-gradient(circle at 50% 40%, rgba(255,255,255,0.18), transparent 40%);
        pointer-events: none;
      }

      .status-bar {
        position: absolute;
        top: 18px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.03em;
        z-index: 2;
      }

      .status-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .signal {
        display: inline-flex;
        gap: 2px;
        align-items: flex-end;
        height: 12px;
      }

      .signal span {
        display: block;
        width: 3px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .signal span:nth-child(1) { height: 4px; }
      .signal span:nth-child(2) { height: 6px; }
      .signal span:nth-child(3) { height: 8px; }
      .signal span:nth-child(4) { height: 10px; }

      .battery {
        position: relative;
        width: 26px;
        height: 12px;
        border: 1.5px solid rgba(255,255,255,0.9);
        border-radius: 3px;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 3px;
        width: 2px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 1.5px 1.5px 1.5px 1.5px;
        background: rgba(255,255,255,0.95);
        border-radius: 2px;
      }

      .lock-screen {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-top: 50px;
      }

      .time {
        font-size: clamp(78px, 13vw, 120px);
        font-weight: 300;
        letter-spacing: -0.06em;
        line-height: 0.9;
        margin-bottom: 18px;
        text-shadow: 0 12px 26px rgba(0,0,0,0.2);
      }

      .date {
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sub);
        margin-bottom: 18px;
      }

      .camera-indicator {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 22px;
        border-radius: 18px;
        background: rgba(0,0,0,0.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        z-index: 3;
      }

      .camera-indicator::before {
        content: "";
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 12px;
        border-radius: 10px;
        background: rgba(0,0,0,0.4);
      }

      .swipe-area {
        position: absolute;
        bottom: 46px;
        left: 50%;
        transform: translateX(-50%);
        width: min(84vw, 270px);
        height: 56px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .swipe-track {
        position: absolute;
        inset: 0;
      }

      .swipe-button {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.25));
        box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(15,25,42,0.9);
        font-size: 22px;
        animation: float 2.8s ease-in-out infinite;
      }

      .swipe-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
      }

      .unlock-hint {
        position: absolute;
        bottom: 118px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes glow {
        0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0.1); }
        50% { box-shadow: 0 0 18px rgba(255,255,255,0.18); }
      }

      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        pointer-events: none;
        animation: glow 4s ease-in-out infinite;
      }

      @media (max-width: 420px) {
        .scene {
          width: 100vw;
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-label="iPhone lock screen">
      <div class="camera-indicator" aria-hidden="true"></div>

      <div class="status-bar">
        <div class="status-left">
          <div class="signal" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span>5G</span>
        </div>
        <div id="statusTime">9:41</div>
        <div class="battery" aria-label="battery" title="battery"></div>
      </div>

      <main class="lock-screen">
        <div class="time" id="clock">9:41</div>
        <div class="date" id="dateText">월요일, 10월 26일</div>
      </main>

      <div class="unlock-hint">Swipe to Unlock</div>
      <div class="swipe-area" aria-label="unlock slider">
        <div class="swipe-track"></div>
        <div class="swipe-button">›</div>
        <div class="swipe-label">Unlock</div>
      </div>
    </div>

    <script>
      function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: false });
        const date = now.toLocaleDateString('ko-KR', {
          weekday: 'long',
          month: 'long',
          day: 'numeric'
        });

        document.getElementById('clock').textContent = time;
        document.getElementById('statusTime').textContent = time;
        document.getElementById('dateText').textContent = date;
      }

      updateClock();
      setInterval(updateClock, 1000 * 30);
    </script>
  </body>
</html>
